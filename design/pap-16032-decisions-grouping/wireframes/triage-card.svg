<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Screen 3: Decision row expanded — triage affordances (queue picker open). Desktop 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />

  <!-- top bar -->
  <line x1="0" y1="56" x2="1280" y2="56" />
  <text x="32" y="35" font-size="14" stroke="none" fill="#000">PAP / Decisions</text>

  <!-- dimmed context rows above/below -->
  <g transform="translate(32, 80)">
    <rect width="1216" height="48" rx="4" fill="#e6e6e6" />
    <text x="16" y="29" font-size="12" stroke="none" fill="#666">(previous decision row, collapsed)</text>
  </g>

  <!-- expanded card -->
  <g transform="translate(32, 144)">
    <rect width="1216" height="520" rx="4" />

    <!-- card header -->
    <rect x="24" y="24" width="40" height="40" rx="4" fill="#e6e6e6" />
    <text x="44" y="49" font-size="12" text-anchor="middle" stroke="none" fill="#000">PR</text>
    <text x="80" y="40" font-size="20" stroke="none" fill="#000">Merge PR #10623 — inbox sort pinning fix</text>
    <text x="80" y="64" font-size="12" stroke="none" fill="#666">Proposed by Gardener · from PAP-16015 · view run · asked 2h ago</text>
    <!-- expiry countdown -->
    <rect x="1016" y="24" width="176" height="24" rx="12" fill="#e6e6e6" />
    <text x="1104" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">expires in 22h · extend ▾</text>

    <!-- body -->
    <rect x="24" y="88" width="768" height="184" rx="4" />
    <text x="40" y="116" font-size="14" stroke="none" fill="#000">What you are deciding</text>
    <text x="40" y="140" font-size="12" stroke="none" fill="#666">Accept merges PR #10623 into master and archives the source task.</text>
    <text x="40" y="160" font-size="12" stroke="none" fill="#666">CI: 23 checks green · diff +214 −80 · reviewed by CTO</text>
    <rect x="40" y="180" width="240" height="72" rx="4" fill="#e6e6e6" />
    <text x="160" y="220" font-size="12" text-anchor="middle" stroke="none" fill="#666">diff / preview thumbnail</text>

    <!-- decide actions -->
    <rect x="24" y="296" width="120" height="40" rx="4" fill="#e6e6e6" />
    <text x="84" y="321" font-size="14" text-anchor="middle" stroke="none" fill="#000">Accept</text>
    <rect x="152" y="296" width="120" height="40" rx="4" />
    <text x="212" y="321" font-size="14" text-anchor="middle" stroke="none" fill="#000">Reject…</text>
    <rect x="280" y="296" width="120" height="40" rx="4" />
    <text x="340" y="321" font-size="14" text-anchor="middle" stroke="none" fill="#000">Dismiss</text>

    <!-- triage strip -->
    <line x1="24" y1="368" x2="1192" y2="368" />
    <text x="24" y="396" font-size="14" stroke="none" fill="#000">Triage</text>

    <!-- queue picker (open) -->
    <text x="24" y="424" font-size="12" stroke="none" fill="#666">Queue</text>
    <rect x="24" y="432" width="192" height="32" rx="4" />
    <text x="40" y="452" font-size="12" stroke="none" fill="#000">PRs ▾</text>
    <rect x="24" y="464" width="192" height="136" rx="4" />
    <text x="40" y="488" font-size="12" stroke="none" fill="#000">✓ PRs</text>
    <text x="40" y="512" font-size="12" stroke="none" fill="#666">Plans</text>
    <text x="40" y="536" font-size="12" stroke="none" fill="#666">foobar</text>
    <text x="40" y="560" font-size="12" stroke="none" fill="#666">Questions</text>
    <text x="40" y="584" font-size="12" stroke="none" fill="#666">+ New queue…</text>

    <!-- urgency segmented control -->
    <text x="256" y="424" font-size="12" stroke="none" fill="#666">When to decide</text>
    <g transform="translate(256, 432)">
      <rect width="112" height="32" rx="4" fill="#e6e6e6" />
      <text x="56" y="20" font-size="12" text-anchor="middle" stroke="none" fill="#000">Today</text>
      <rect x="112" width="112" height="32" rx="4" />
      <text x="168" y="20" font-size="12" text-anchor="middle" stroke="none" fill="#000">This week</text>
      <rect x="224" width="112" height="32" rx="4" />
      <text x="280" y="20" font-size="12" text-anchor="middle" stroke="none" fill="#000">Whenever</text>
    </g>
    <text x="256" y="488" font-size="12" stroke="none" fill="#666">Set by Prioritizer agent · you can override</text>

    <!-- snooze / route -->
    <text x="640" y="424" font-size="12" stroke="none" fill="#666">Defer</text>
    <rect x="640" y="432" width="136" height="32" rx="4" />
    <text x="708" y="452" font-size="12" text-anchor="middle" stroke="none" fill="#000">Snooze ▾</text>
    <rect x="784" y="432" width="176" height="32" rx="4" />
    <text x="872" y="452" font-size="12" text-anchor="middle" stroke="none" fill="#000">Route to agent…</text>
    <text x="640" y="492" font-size="12" stroke="none" fill="#666">Snooze hides until a date; Route asks an agent to</text>
    <text x="640" y="508" font-size="12" stroke="none" fill="#666">prepare a recommendation and re-surface it.</text>
  </g>

  <g transform="translate(32, 680)">
    <rect width="1216" height="48" rx="4" fill="#e6e6e6" />
    <text x="16" y="29" font-size="12" stroke="none" fill="#666">(next decision row, collapsed)</text>
  </g>

  <!-- annotations -->
  <g stroke="#d33" stroke-dasharray="4 3">
    <circle cx="1224" cy="180" r="12" fill="#fff" />
    <text x="1224" y="184" font-size="12" text-anchor="middle" stroke="none" fill="#d33">1</text>
    <circle cx="120" cy="600" r="12" fill="#fff" />
    <text x="120" y="604" font-size="12" text-anchor="middle" stroke="none" fill="#d33">2</text>
    <circle cx="624" cy="580" r="12" fill="#fff" />
    <text x="624" y="584" font-size="12" text-anchor="middle" stroke="none" fill="#d33">3</text>
    <circle cx="992" cy="580" r="12" fill="#fff" />
    <text x="992" y="584" font-size="12" text-anchor="middle" stroke="none" fill="#d33">4</text>
  </g>
</svg>

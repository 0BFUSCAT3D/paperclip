<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Screen 4: Aging shelf — bulk retirement of stale decisions. Desktop 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />

  <!-- top bar -->
  <line x1="0" y1="56" x2="1280" y2="56" />
  <text x="32" y="35" font-size="14" stroke="none" fill="#000">PAP / Decisions / Aging shelf</text>

  <!-- header -->
  <text x="32" y="104" font-size="28" stroke="none" fill="#000">Aging shelf</text>
  <text x="32" y="132" font-size="12" stroke="none" fill="#666">146 items with no activity for 30+ days. Nothing here is deleted — archived items stay searchable and can be revived.</text>

  <!-- agent proposal banner -->
  <g transform="translate(32, 152)">
    <rect width="1216" height="72" rx="4" />
    <rect x="16" y="20" width="32" height="32" rx="16" fill="#e6e6e6" />
    <text x="64" y="36" font-size="14" stroke="none" fill="#000">Prioritizer reviewed this shelf: 87 look safe to archive, 12 still matter (kept out below)</text>
    <text x="64" y="56" font-size="12" stroke="none" fill="#666">Reasoning attached per item · superseded PRs, closed epics, expired confirmations that were re-asked</text>
    <rect x="960" y="20" width="152" height="32" rx="4" fill="#e6e6e6" />
    <text x="1036" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Archive 87 proposed</text>
    <rect x="1120" y="20" width="80" height="32" rx="4" />
    <text x="1160" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Review…</text>
  </g>

  <!-- filter row -->
  <g transform="translate(32, 248)">
    <rect width="128" height="24" rx="12" fill="#e6e6e6" />
    <text x="64" y="16" font-size="12" text-anchor="middle" stroke="none" fill="#000">30–90 days · 98</text>
  </g>
  <g transform="translate(168, 248)">
    <rect width="120" height="24" rx="12" />
    <text x="60" y="16" font-size="12" text-anchor="middle" stroke="none" fill="#000">90+ days · 48</text>
  </g>
  <g transform="translate(296, 248)">
    <rect width="136" height="24" rx="12" />
    <text x="68" y="16" font-size="12" text-anchor="middle" stroke="none" fill="#000">by queue ▾</text>
  </g>

  <!-- stale rows -->
  <g transform="translate(32, 296)">
    <rect width="1216" height="64" rx="4" />
    <rect x="16" y="16" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="30" font-size="14" stroke="none" fill="#000">Blog: W1.2 — Why agents need org charts (in review since 04-27)</text>
    <text x="56" y="50" font-size="12" stroke="none" fill="#666">96 days idle · Prioritizer: "superseded by launch content plan" → archive</text>
    <rect x="1040" y="16" width="80" height="32" rx="4" />
    <text x="1080" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Keep</text>
    <rect x="1128" y="16" width="80" height="32" rx="4" fill="#e6e6e6" />
    <text x="1168" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Archive</text>
  </g>
  <g transform="translate(32, 368)">
    <rect width="1216" height="64" rx="4" />
    <rect x="16" y="16" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="30" font-size="14" stroke="none" fill="#000">QA stable papercliper.com login-to-tenant smoke (05-04)</text>
    <text x="56" y="50" font-size="12" stroke="none" fill="#666">89 days idle · Prioritizer: "environment retired" → archive</text>
    <rect x="1040" y="16" width="80" height="32" rx="4" />
    <text x="1080" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Keep</text>
    <rect x="1128" y="16" width="80" height="32" rx="4" fill="#e6e6e6" />
    <text x="1168" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Archive</text>
  </g>
  <g transform="translate(32, 440)">
    <rect width="1216" height="64" rx="4" />
    <rect x="16" y="16" width="16" height="16" rx="2" fill="#fff" />
    <text x="56" y="30" font-size="14" stroke="none" fill="#000">Operator: configure production AWS access for Phase 4 (05-21)</text>
    <text x="56" y="50" font-size="12" stroke="none" fill="#666">72 days idle · Prioritizer: "still blocks CloudOps — KEEP, decide-by set to next week"</text>
    <rect x="1040" y="16" width="80" height="32" rx="4" fill="#e6e6e6" />
    <text x="1080" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Keep</text>
    <rect x="1128" y="16" width="80" height="32" rx="4" />
    <text x="1168" y="36" font-size="12" text-anchor="middle" stroke="none" fill="#000">Archive</text>
  </g>
  <text x="32" y="536" font-size="12" stroke="none" fill="#666">+ 143 more…</text>

  <!-- footer policy card -->
  <g transform="translate(32, 568)">
    <rect width="1216" height="120" rx="4" />
    <text x="16" y="32" font-size="14" stroke="none" fill="#000">Retention policy</text>
    <text x="16" y="60" font-size="12" stroke="none" fill="#666">· Items idle for 30 days leave the main list and land here (per-queue override: PRs 14 days).</text>
    <text x="16" y="80" font-size="12" stroke="none" fill="#666">· Items idle for 90 days auto-archive unless an agent or you marked them Keep.</text>
    <text x="16" y="100" font-size="12" stroke="none" fill="#666">· Archiving a decision notifies its origin agent so the underlying task gets re-triaged, not orphaned.</text>
  </g>

  <!-- annotations -->
  <g stroke="#d33" stroke-dasharray="4 3">
    <circle cx="944" cy="176" r="12" fill="#fff" />
    <text x="944" y="180" font-size="12" text-anchor="middle" stroke="none" fill="#d33">1</text>
    <circle cx="1016" cy="480" r="12" fill="#fff" />
    <text x="1016" y="484" font-size="12" text-anchor="middle" stroke="none" fill="#d33">2</text>
    <circle cx="16" cy="600" r="12" fill="#fff" />
    <text x="16" y="604" font-size="12" text-anchor="middle" stroke="none" fill="#d33">3</text>
  </g>
</svg>

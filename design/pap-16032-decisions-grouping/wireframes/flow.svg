<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Flow: Today's desk -> Queue detail / Triage card / Aging shelf -->
  <rect x="0" y="0" width="1280" height="360" />

  <!-- 1. home -->
  <g transform="translate(48, 80)">
    <rect width="240" height="160" rx="4" />
    <rect x="16" y="16" width="208" height="16" fill="#e6e6e6" />
    <rect x="16" y="44" width="120" height="12" fill="#e6e6e6" />
    <rect x="16" y="68" width="144" height="24" rx="4" />
    <rect x="16" y="100" width="144" height="24" rx="4" />
    <rect x="176" y="68" width="48" height="56" rx="4" fill="#e6e6e6" />
    <text x="120" y="196" font-size="14" text-anchor="middle" stroke="none" fill="#000">1 · Today's desk</text>
    <text x="120" y="216" font-size="12" text-anchor="middle" stroke="none" fill="#666">default landing view</text>
  </g>

  <!-- arrows -->
  <line x1="288" y1="128" x2="368" y2="96" />
  <path d="M 368 96 l -12 0 l 8 -8 z" fill="#000" stroke="none" />
  <line x1="288" y1="160" x2="368" y2="160" />
  <path d="M 368 160 l -12 -5 l 0 10 z" fill="#000" stroke="none" />
  <line x1="288" y1="192" x2="368" y2="240" />
  <path d="M 368 240 l -12 -2 l 6 -9 z" fill="#000" stroke="none" />

  <!-- 2. queue detail -->
  <g transform="translate(376, 32)">
    <rect width="240" height="120" rx="4" />
    <rect x="16" y="16" width="120" height="16" fill="#e6e6e6" />
    <rect x="16" y="44" width="208" height="16" rx="4" fill="#e6e6e6" />
    <rect x="16" y="68" width="208" height="12" rx="4" />
    <rect x="16" y="88" width="208" height="12" rx="4" />
    <text x="120" y="140" font-size="14" text-anchor="middle" stroke="none" fill="#000">2 · Queue detail (bulk)</text>
  </g>

  <!-- 3. triage card -->
  <g transform="translate(376, 176)">
    <rect width="240" height="120" rx="4" />
    <rect x="16" y="16" width="160" height="16" fill="#e6e6e6" />
    <rect x="16" y="44" width="96" height="24" rx="4" fill="#e6e6e6" />
    <rect x="120" y="44" width="96" height="24" rx="4" />
    <rect x="16" y="80" width="200" height="24" rx="4" />
  </g>
  <text x="496" y="316" font-size="14" text-anchor="middle" stroke="none" fill="#000">3 · Expanded card + triage strip</text>

  <!-- arrow queue->aging -->
  <line x1="616" y1="92" x2="784" y2="92" />
  <path d="M 784 92 l -12 -5 l 0 10 z" fill="#000" stroke="none" />

  <!-- 4. aging shelf -->
  <g transform="translate(792, 32)">
    <rect width="240" height="120" rx="4" />
    <rect x="16" y="16" width="208" height="24" rx="4" fill="#e6e6e6" />
    <rect x="16" y="52" width="208" height="12" rx="4" />
    <rect x="16" y="72" width="208" height="12" rx="4" />
    <rect x="16" y="92" width="120" height="12" rx="4" fill="#e6e6e6" />
    <text x="120" y="140" font-size="14" text-anchor="middle" stroke="none" fill="#000">4 · Aging shelf (sweep)</text>
  </g>

  <!-- caption -->
  <text x="792" y="216" font-size="12" stroke="none" fill="#666">Decide / snooze / queue actions round-trip</text>
  <text x="792" y="236" font-size="12" stroke="none" fill="#666">back to 1. Archive keeps history searchable.</text>
</svg>

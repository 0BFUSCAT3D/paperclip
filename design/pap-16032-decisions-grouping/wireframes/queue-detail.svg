<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Screen 2: Queue detail — "PRs" queue with bulk actions. Desktop 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />

  <!-- top bar -->
  <line x1="0" y1="56" x2="1280" y2="56" />
  <text x="32" y="35" font-size="14" stroke="none" fill="#000">PAP / Decisions / Queue: PRs</text>

  <!-- header -->
  <text x="32" y="104" font-size="28" stroke="none" fill="#000">PRs</text>
  <text x="104" y="104" font-size="14" stroke="none" fill="#666">5 pending · updated 2h ago by Gardener</text>
  <text x="32" y="132" font-size="12" stroke="none" fill="#666">Merge confirmations from the Gardener pipeline. Say "add this to the PRs queue" on any decision.</text>
  <g transform="translate(1064, 80)">
    <rect width="88" height="32" rx="4" />
    <text x="44" y="20" font-size="12" text-anchor="middle" stroke="none" fill="#000">Rename</text>
  </g>
  <g transform="translate(1160, 80)">
    <rect width="88" height="32" rx="4" />
    <text x="44" y="20" font-size="12" text-anchor="middle" stroke="none" fill="#000">Mute ▾</text>
  </g>

  <!-- bulk action bar -->
  <g transform="translate(32, 160)">
    <rect width="864" height="48" rx="4" fill="#e6e6e6" />
    <rect x="16" y="16" width="16" height="16" rx="2" fill="#fff" />
    <line x1="19" y1="24" x2="24" y2="29" /><line x1="24" y1="29" x2="30" y2="19" />
    <text x="48" y="30" font-size="14" stroke="none" fill="#000">4 of 5 selected</text>
    <rect x="560" y="8" width="152" height="32" rx="4" fill="#fff" />
    <text x="636" y="28" font-size="12" text-anchor="middle" stroke="none" fill="#000">Accept selected (4)</text>
    <rect x="720" y="8" width="128" height="32" rx="4" fill="#fff" />
    <text x="784" y="28" font-size="12" text-anchor="middle" stroke="none" fill="#000">Reject with note…</text>
  </g>

  <!-- rows -->
  <g transform="translate(32, 224)">
    <rect width="864" height="72" rx="4" />
    <rect x="16" y="28" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="32" font-size="14" stroke="none" fill="#000">Merge PR #10623 — inbox sort pinning fix</text>
    <text x="56" y="54" font-size="12" stroke="none" fill="#666">CI green · +214 −80 · PAP-16015 · asked 2h ago · expires in 22h</text>
    <rect x="672" y="20" width="80" height="32" rx="4" />
    <text x="712" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">View PR</text>
    <rect x="760" y="20" width="88" height="32" rx="4" fill="#e6e6e6" />
    <text x="804" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Decide</text>
  </g>
  <g transform="translate(32, 304)">
    <rect width="864" height="72" rx="4" />
    <rect x="16" y="28" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="32" font-size="14" stroke="none" fill="#000">Merge PR #10606 — chat-style task view (flagged)</text>
    <text x="56" y="54" font-size="12" stroke="none" fill="#666">CI green · +820 −112 · PAP-15874 · asked 5h ago</text>
    <rect x="672" y="20" width="80" height="32" rx="4" />
    <text x="712" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">View PR</text>
    <rect x="760" y="20" width="88" height="32" rx="4" fill="#e6e6e6" />
    <text x="804" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Decide</text>
  </g>
  <g transform="translate(32, 384)">
    <rect width="864" height="72" rx="4" />
    <rect x="16" y="28" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="32" font-size="14" stroke="none" fill="#000">Merge PR #10601 — sandbox git copy-back fix</text>
    <text x="56" y="54" font-size="12" stroke="none" fill="#666">CI green · +96 −14 · PAP-15981 · asked yesterday</text>
    <rect x="672" y="20" width="80" height="32" rx="4" />
    <text x="712" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">View PR</text>
    <rect x="760" y="20" width="88" height="32" rx="4" fill="#e6e6e6" />
    <text x="804" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Decide</text>
  </g>
  <g transform="translate(32, 464)">
    <rect width="864" height="72" rx="4" />
    <rect x="16" y="28" width="16" height="16" rx="2" fill="#e6e6e6" />
    <text x="56" y="32" font-size="14" stroke="none" fill="#000">Merge PR #10594 — decision-signing secret hotfix</text>
    <text x="56" y="54" font-size="12" stroke="none" fill="#666">CI green · +42 −8 · PAP-15984 · asked yesterday</text>
    <rect x="672" y="20" width="80" height="32" rx="4" />
    <text x="712" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">View PR</text>
    <rect x="760" y="20" width="88" height="32" rx="4" fill="#e6e6e6" />
    <text x="804" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Decide</text>
  </g>
  <g transform="translate(32, 544)">
    <rect width="864" height="72" rx="4" />
    <rect x="16" y="28" width="16" height="16" rx="2" fill="#fff" />
    <text x="56" y="32" font-size="14" stroke="none" fill="#000">Merge PR #9744 — blockquote insert (targets epic branch)</text>
    <text x="56" y="54" font-size="12" stroke="none" fill="#666">needs rebase · excluded from bulk accept · asked 3d ago</text>
    <rect x="672" y="20" width="80" height="32" rx="4" />
    <text x="712" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">View PR</text>
    <rect x="760" y="20" width="88" height="32" rx="4" />
    <text x="804" y="40" font-size="12" text-anchor="middle" stroke="none" fill="#000">Decide</text>
  </g>

  <!-- right rail: queue rules -->
  <g transform="translate(920, 160)">
    <rect width="328" height="256" rx="4" />
    <text x="16" y="32" font-size="14" stroke="none" fill="#000">Queue rules</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#000">Members added by:</text>
    <text x="16" y="84" font-size="12" stroke="none" fill="#666">· Gardener — merge confirmations (auto)</text>
    <text x="16" y="104" font-size="12" stroke="none" fill="#666">· You / any agent — "add to PRs queue"</text>
    <line x1="16" y1="124" x2="312" y2="124" />
    <text x="16" y="152" font-size="12" stroke="none" fill="#000">Retention:</text>
    <text x="16" y="172" font-size="12" stroke="none" fill="#666">items idle 14 days → aging shelf</text>
    <line x1="16" y1="192" x2="312" y2="192" />
    <text x="16" y="220" font-size="12" stroke="none" fill="#000">Notify:</text>
    <text x="16" y="240" font-size="12" stroke="none" fill="#666">badge on sidebar · daily digest off</text>
  </g>

  <g transform="translate(920, 440)">
    <rect width="328" height="128" rx="4" />
    <text x="16" y="32" font-size="14" stroke="none" fill="#000">Recently decided here</text>
    <text x="16" y="60" font-size="12" stroke="none" fill="#666">#10574 accepted · yesterday</text>
    <text x="16" y="80" font-size="12" stroke="none" fill="#666">#10568 accepted · 07-31</text>
    <text x="16" y="100" font-size="12" stroke="none" fill="#666">#10542 rejected (note) · 07-30</text>
  </g>

  <!-- annotations -->
  <g stroke="#d33" stroke-dasharray="4 3">
    <circle cx="464" cy="184" r="12" fill="#fff" />
    <text x="464" y="188" font-size="12" text-anchor="middle" stroke="none" fill="#d33">1</text>
    <circle cx="920" cy="288" r="12" fill="#fff" />
    <text x="920" y="292" font-size="12" text-anchor="middle" stroke="none" fill="#d33">2</text>
    <circle cx="56" cy="580" r="12" fill="#fff" />
    <text x="56" y="584" font-size="12" text-anchor="middle" stroke="none" fill="#d33">3</text>
  </g>
